<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f3a5e" />
<title>Salina · Dégustation 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<!-- ============================================================
     SALINA · VIEWER 3D — FICHIER UNIQUE (v2, réécrit de zéro)
     ------------------------------------------------------------
     Tout est dans ce fichier : CSS + JS + config des plats.
     Un seul fichier à déployer → aucun décalage de cache possible.

     DEUX TYPES DE PLATS :
       A. splat seul        → le .ply contient nourriture + assiette
       B. splat + assiette  → le .ply ne contient QUE la nourriture,
                              l'assiette est un mesh 3D (.glb) propre.
                              C'est le mode recommandé : aucune trou possible.

     DEBUG : ajouter &debug=1 à l'URL → panneau d'état à l'écran
             (ce qui est chargé, les erreurs, les valeurs mesurées).
     ============================================================ -->
<style>
  :root {
    --marine-deep: #0f3a5e;
    --marine:      #14497a;
    --night:       #071c2e;
    --cream:       #f4f1ea;
    --gold:        #c8a45a;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans:  'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--night);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* Le canvas est transparent : le fond ci-dessous se voit à travers
     les zones sans gaussiennes. */
  #stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% -5%, rgba(125,180,221,0.22), transparent 60%),
      radial-gradient(ellipse 70% 45% at 100% 100%, rgba(200,164,90,0.10), transparent 55%),
      linear-gradient(180deg, var(--marine) 0%, var(--marine-deep) 45%, var(--night) 100%);
  }
  #canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }

  /* ---------- UI ---------- */
  .pill {
    position: fixed; z-index: 10;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 18px;
    background: rgba(7, 28, 46, 0.55);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 100px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; text-decoration: none;
  }
  #back {
    top: max(16px, env(safe-area-inset-top)); left: 16px;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
  }
  #back svg { width: 15px; height: 15px; }
  #label {
    top: max(16px, env(safe-area-inset-top)); right: 16px;
    flex-direction: column; align-items: flex-end; gap: 1px;
    padding: 10px 18px; text-align: right;
  }
  #label .n { font-family: var(--font-serif); font-style: italic; font-size: 17px; }
  #label .p { font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.62); }

  #hint {
    position: fixed; z-index: 10;
    bottom: max(110px, calc(env(safe-area-inset-bottom) + 100px));
    left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.55); white-space: nowrap;
    transition: opacity 0.6s ease; pointer-events: none;
  }
  #hint.gone { opacity: 0; }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--marine-deep);
    transition: opacity 0.5s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader .mark {
    font-family: var(--font-serif); font-size: 34px; font-style: italic;
    color: var(--cream); letter-spacing: 0.04em;
  }
  #loader .sub {
    margin: 8px 0 30px;
    font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  #bar { width: 168px; height: 2px; background: rgba(255,255,255,0.16); border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.25s ease; }
  #err {
    margin-top: 22px; max-width: 300px; text-align: center;
    font-family: var(--font-serif); font-style: italic; font-size: 15px;
    color: #ffb4a2; line-height: 1.5; display: none;
  }

  /* ---------- Mode caméra ---------- */
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: none; background: #000;
  }
  body.cam #video { display: block; }
  body.cam #stage { display: none; }   /* le décor studio laisse place au réel */

  #tools {
    position: fixed; z-index: 20;
    bottom: max(26px, calc(env(safe-area-inset-bottom) + 16px));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 22px;
  }
  .tool {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(7,28,46,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff; cursor: pointer;
  }
  .tool svg { width: 20px; height: 20px; }
  .tool:active { transform: scale(0.92); }
  .tool.hidden { display: none; }
  .tool.on { background: var(--gold); border-color: var(--gold); color: #14283c; }
  .shutter {
    width: 66px; height: 66px; border-radius: 50%;
    background: #fff; border: 4px solid rgba(255,255,255,0.55);
    cursor: pointer; padding: 0;
  }
  .shutter:active { transform: scale(0.93); }
  #flash {
    position: fixed; inset: 0; z-index: 60; background: #fff;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  #flash.on { opacity: 0.85; transition: none; }

  /* ---------- Mode édition (&edit=1) ---------- */
  #edit {
    position: fixed; z-index: 90; top: 90px; right: 14px;
    width: 268px; max-height: 78vh; overflow: auto;
    padding: 14px 14px 12px;
    background: rgba(7, 28, 46, 0.9);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; font-size: 12px;
  }
  #edit b { display: block; margin-bottom: 10px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  #edit label { display: block; margin-bottom: 9px; }
  #edit .lbl { display: block; font-size: 10.5px; color: rgba(255,255,255,0.65); margin-bottom: 3px; }
  #edit input[type=range] { width: 205px; vertical-align: middle; accent-color: var(--gold); }
  #edit .val { display: inline-block; width: 48px; text-align: right; font: 11px ui-monospace, monospace; color: var(--gold); }
  #edit button {
    width: 100%; margin-top: 6px; padding: 8px;
    background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    font-size: 11px; cursor: pointer;
  }
  #cfg {
    margin-top: 10px; padding: 8px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 10px/1.5 ui-monospace, monospace; color: #7ee787;
    white-space: pre-wrap; user-select: all;
  }

  /* ---------- Debug (&debug=1) ---------- */
  #debug {
    position: fixed; z-index: 100; left: 10px; bottom: 10px;
    max-width: min(92vw, 460px); max-height: 46vh; overflow: auto;
    padding: 10px 12px;
    background: rgba(0,0,0,0.82); color: #9fe;
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    border-radius: 8px; white-space: pre-wrap; display: none;
  }
  #debug .ok  { color: #7ee787; }
  #debug .bad { color: #ff7b72; }
</style>
</head>
<body>

<div id="stage"></div>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<a id="back" class="pill" href="carte.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
  </svg>
  La carte
</a>

<div id="label" class="pill">
  <span class="n" id="dishName">—</span>
  <span class="p" id="dishPrice"></span>
</div>

<div id="hint">Pivotez &amp; zoomez le plat</div>

<div id="tools">
  <button id="btnReset" class="tool" aria-label="Recadrer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"></polyline>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
    </svg>
  </button>
  <button id="btnShot" class="shutter" aria-label="Prendre la photo"></button>
  <button id="btnCam" class="tool" aria-label="Mode caméra">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
      <circle cx="12" cy="13" r="4"></circle>
    </svg>
  </button>
  <button id="btnFlip" class="tool hidden" aria-label="Changer de caméra">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
      <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
    </svg>
  </button>
</div>

<div id="loader">
  <div class="mark">Salina</div>
  <div class="sub">Dégustation 3D</div>
  <div id="bar"><span id="fill"></span></div>
  <div id="err"></div>
</div>

<div id="flash"></div>
<pre id="debug"></pre>

<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.10.0/build/playcanvas.min.js"></script>
<script>
(async function () {
  'use strict';

  /* ==========================================================
     1. CONFIGURATION DES PLATS
     ----------------------------------------------------------
     Pour AJOUTER un plat :
       1. Uploader le .ply sur R2 (dossier Salina/)
       2. Ajouter une entrée ici
       3. Mettre splat:"laClé" sur le plat dans salina-menu.html

     Deux modes :
       · sans "plate"  → le .ply contient nourriture + assiette.
                         Le viewer redresse et centre tout seul (auto-pose).
       · avec "plate"  → le .ply ne contient QUE la nourriture, l'assiette
                         est le mesh .glb. Aucun trou possible.
                         Le .ply doit être orienté à l'endroit dans SuperSplat.
     ========================================================== */
  const R2 = 'https://pub-cb6130d8c47d41edaef19f32291a50d2.r2.dev/Salina';

  const DISHES = {
    // ---- Mode SPLAT + ASSIETTE 3D (recommandé) ----
    thon: {
      name: 'Thon',
      price: '28 €',
      ply: R2 + '/thon2.ply',           // PLY nettoyé (nom neuf : aucun cache possible)
      // Orientation : gérée par la mise à plat automatique (plan du dressage
      // aligné sur l'assiette). Retouche éventuelle : &ex= &ey= &ez= &flip=1
      euler: [-5, 78, 16],   // pose validée au curseur
      // Assiette GÉNÉRÉE PAR LE VIEWER (aucun fichier à héberger).
      // Elle se dimensionne toute seule sur la largeur de la nourriture.
      plate: {
        glb: R2 + '/assiette2.glb',  // vrai bol modélisé (Blender → glTF), mesh non décimé
        floorRatio: -0.0004,         // fond intérieur du bol ÷ diamètre (mesuré)
        foodRatio: 0.40,  // largeur dressage ÷ diamètre assiette → &fr=
        depth: 0.045,     // (repli si le GLB ne charge pas)      → &pdepth=
        sink: 0.02,       // enfoncement du dressage → &sink=
        dx: -85, dz: -55, zoom: 1.35,   // placement validé au curseur (agrandi)
        color: [0.97, 0.96, 0.95],
      },
    },

    // ---- Mode SPLAT SEUL (le .ply contient déjà l'assiette) ----
    tacos:   { name: 'Tacos Saumon', price: '20 €', ply: R2 + '/tacos.ply' },
    saumon:  { name: 'Saumon',       price: '26 €', ply: R2 + '/tartare-2.ply' },
    pasta: {
      name: 'Spaghetto alla chitarra',
      price: '38 €',
      ply: R2 + '/pates.ply',           // nourriture seule (nettoyée SuperSplat)
      euler: [0, 0, 0],                 // à calibrer au curseur (&edit=1)
      plate: {
        glb: R2 + '/kenzo.glb',
        floorRatio: -0.0234,            // fond intérieur du bol ÷ diamètre (mesuré)
        foodRatio: 0.40,  // largeur dressage ÷ diamètre assiette → &fr=
        depth: 0.045,     // repli si le GLB ne charge pas         → &pdepth=
        sink: 0.02,       // enfoncement du dressage               → &sink=
        dx: 0, dz: 0, zoom: 1.35,
        color: [0.97, 0.96, 0.95],
      },
    },
    dessert: { name: 'Cannolo Sicilien',        price: '15 €', ply: R2 + '/canolo.ply' },
  };

  /* ---------- Mise en scène (identique à Baia Bella) ---------- */
  const FOV        = 45;
  const CAM_DIST   = 10000;   // distance d'orbite
  const LOOK_Y     = 0;       // la caméra vise l'origine
  const ELEV_START = 46, ELEV_MIN = 30, ELEV_MAX = 70;
  const ZOOM_MIN   = 0.55, ZOOM_MAX = 1.7;
  const ROT_SPEED  = 0.6, ELEV_SPEED = 0.30;
  const SMOOTH     = 0.25, FRICTION = 0.94;
  const FOOD_SIZE  = 2300;    // largeur cible d'un plat sans assiette

  /* ==========================================================
     2. Paramètres URL & debug
     ========================================================== */
  const P = new URLSearchParams(location.search);
  const num = (k, fb) => { const n = parseFloat(P.get(k)); return Number.isFinite(n) ? n : fb; };
  const key = DISHES[P.get('dish')] ? P.get('dish') : 'thon';
  const dish = DISHES[key];

  const DEBUG = P.get('debug') === '1';
  const dbgEl = document.getElementById('debug');
  const lines = [];
  function dbg(msg, cls) {
    lines.push(cls ? `<span class="${cls}">${msg}</span>` : msg);
    if (DEBUG) { dbgEl.style.display = 'block'; dbgEl.innerHTML = lines.join('\n'); }
    console.log('[salina]', msg);
  }
  dbg(`plat = ${key}`);

  document.getElementById('dishName').textContent = dish.name;
  document.getElementById('dishPrice').textContent = dish.price;
  document.title = `Salina · ${dish.name} en 3D`;

  const fill = document.getElementById('fill');
  const loader = document.getElementById('loader');
  const errEl = document.getElementById('err');
  const setProgress = (p) => { fill.style.width = Math.max(0, Math.min(100, p)) + '%'; };
  function fatal(msg) {
    errEl.style.display = 'block';
    errEl.textContent = msg;
    dbg('FATAL: ' + msg, 'bad');
  }

  /* ==========================================================
     3. Initialisation PlayCanvas
     ========================================================== */
  const canvas = document.getElementById('canvas');
  let device;
  try {
    device = await pc.createGraphicsDevice(canvas, {
      deviceTypes: ['webgl2'], antialias: true, alpha: true,
      preserveDrawingBuffer: true,   // nécessaire pour la capture photo
    });
  } catch (e) {
    fatal('3D non supportée sur cet appareil.'); return;
  }
  device.maxPixelRatio = Math.min(window.devicePixelRatio || 1, 2);

  const app = new pc.AppBase(canvas);
  const opts = new pc.AppOptions();
  opts.graphicsDevice = device;
  opts.componentSystems = [
    pc.RenderComponentSystem,     // meshes (assiette GLB)
    pc.CameraComponentSystem,
    pc.LightComponentSystem,      // éclairage des meshes
    pc.GSplatComponentSystem,     // gaussian splats
  ];
  opts.resourceHandlers = [
    pc.TextureHandler,
    pc.ContainerHandler,          // .glb
    pc.GSplatHandler,             // .ply
  ];
  app.init(opts);
  app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
  app.setCanvasResolution(pc.RESOLUTION_AUTO);
  window.addEventListener('resize', () => app.resizeCanvas());

  // Caméra : fond transparent (le dégradé CSS se voit à travers les trous)
  const camera = new pc.Entity('camera');
  camera.addComponent('camera', {
    clearColor: new pc.Color(0, 0, 0, 0),
    fov: FOV, nearClip: 10, farClip: 200000,
  });
  app.root.addChild(camera);

  // Éclairage (n'affecte QUE les meshes ; les splats portent leur propre couleur)
  app.scene.ambientLight = new pc.Color(0.62, 0.62, 0.60);
  const sun = new pc.Entity('sun');
  sun.addComponent('light', { type: 'directional', intensity: 1.1, castShadows: false });
  sun.setEulerAngles(58, 30, 0);
  app.root.addChild(sun);

  const pivot = new pc.Entity('pivot');
  app.root.addChild(pivot);

  dbg('moteur 3D initialisé', 'ok');

  /* ==========================================================
     4. Chargement du splat (.ply) + de l'assiette (.glb)
     ========================================================== */
  // Cache-buster sur les modèles : R2 et le navigateur mettent les .ply/.glb
  // en cache. Quand un modèle est remplacé sous le MÊME nom, il faut changer
  // l'URL pour forcer le rechargement → &v=2, &v=3, etc.
  const V = P.get('v') || '1';

  function loadAsset(url, type, name) {
    return new Promise((resolve, reject) => {
      const asset = new pc.Asset(name, type, { url: `${url}?v=${V}` });
      asset.once('load', () => resolve(asset));
      asset.once('error', (e) => reject(new Error(String(e))));
      app.assets.add(asset);
      app.assets.load(asset);
      if (type === 'gsplat') {
        asset.on('progress', (r, t) => { if (t > 0) setProgress(10 + (r / t) * 80); });
      }
    });
  }

  let splatAsset;
  try {
    splatAsset = await loadAsset(dish.ply, 'gsplat', key);
    dbg('splat chargé : ' + dish.ply.split('/').pop() + ' (v=' + V + ')', 'ok');
  } catch (e) {
    fatal("Le modèle 3D n'a pas pu être chargé."); 
    dbg('erreur splat : ' + dish.ply + ' → ' + e.message, 'bad');
    return;
  }

  // Assiette 3D (mesh GLB). Optionnelle : en cas d'échec, repli sur l'assiette
  // générée en code, pour que le plat reste toujours visible.
  let plateAsset = null;
  if (dish.plate && dish.plate.glb) {
    try {
      plateAsset = await loadAsset(dish.plate.glb, 'container', key + '-plate');
      dbg('assiette 3D chargée', 'ok');
    } catch (e) {
      dbg('assiette GLB introuvable → assiette générée en repli', 'bad');
    }
  }
  setProgress(94);

  /* ==========================================================
     5. Mesure du nuage : centre, étendue, plan (auto-pose)
     ========================================================== */
  function measure(asset) {
    try {
      const gd = asset.resource.gsplatData || asset.resource.splatData;
      const N = gd && gd.numSplats;
      if (!gd || !gd.getProp || !N) return null;
      const x = gd.getProp('x'), y = gd.getProp('y'), z = gd.getProp('z'), o = gd.getProp('opacity');
      if (!x || !y || !z) return null;

      const step = Math.max(1, Math.floor(N / 25000));
      const xs = [], ys = [], zs = [];
      for (let i = 0; i < N; i += step) {
        if (o && 1 / (1 + Math.exp(-o[i])) < 0.55) continue;
        xs.push(x[i]); ys.push(y[i]); zs.push(z[i]);
      }
      const n = xs.length;
      if (n < 200) return null;

      const srt = (a) => a.slice().sort((p, q) => p - q);
      const pct = (s, p) => s[Math.max(0, Math.min(s.length - 1, Math.round(p * (s.length - 1))))];
      const sx = srt(xs), sy = srt(ys), sz = srt(zs);
      const centre = [
        (pct(sx, 0.02) + pct(sx, 0.98)) / 2,
        (pct(sy, 0.02) + pct(sy, 0.98)) / 2,
        (pct(sz, 0.02) + pct(sz, 0.98)) / 2,
      ];
      const size = [
        pct(sx, 0.98) - pct(sx, 0.02),
        pct(sy, 0.98) - pct(sy, 0.02),
        pct(sz, 0.98) - pct(sz, 0.02),
      ];

      // Plan dominant (Jacobi sur la covariance) → normale = axe le plus "plat"
      let xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
      for (let i = 0; i < n; i++) {
        const dx = xs[i] - centre[0], dy = ys[i] - centre[1], dz = zs[i] - centre[2];
        xx += dx * dx; xy += dx * dy; xz += dx * dz; yy += dy * dy; yz += dy * dz; zz += dz * dz;
      }
      const A = [[xx / n, xy / n, xz / n], [xy / n, yy / n, yz / n], [xz / n, yz / n, zz / n]];
      const V = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      for (let it = 0; it < 30; it++) {
        let p = 0, q = 1;
        if (Math.abs(A[0][2]) > Math.abs(A[p][q])) { p = 0; q = 2; }
        if (Math.abs(A[1][2]) > Math.abs(A[p][q])) { p = 1; q = 2; }
        if (Math.abs(A[p][q]) < 1e-12) break;
        const th = (A[q][q] - A[p][p]) / (2 * A[p][q]);
        const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
        const c = 1 / Math.sqrt(t * t + 1), s = t * c;
        const app_ = A[p][p], aqq = A[q][q], apq = A[p][q];
        A[p][p] = c * c * app_ - 2 * s * c * apq + s * s * aqq;
        A[q][q] = s * s * app_ + 2 * s * c * apq + c * c * aqq;
        A[p][q] = A[q][p] = 0;
        for (let k = 0; k < 3; k++) {
          if (k !== p && k !== q) {
            const akp = A[k][p], akq = A[k][q];
            A[k][p] = A[p][k] = c * akp - s * akq;
            A[k][q] = A[q][k] = s * akp + c * akq;
          }
          const vkp = V[k][p], vkq = V[k][q];
          V[k][p] = c * vkp - s * vkq;
          V[k][q] = s * vkp + c * vkq;
        }
      }
      let mi = 0;
      if (A[1][1] < A[mi][mi]) mi = 1;
      if (A[2][2] < A[mi][mi]) mi = 2;
      let nrm = [V[0][mi], V[1][mi], V[2][mi]];
      const L = Math.hypot(nrm[0], nrm[1], nrm[2]) || 1;
      nrm = [nrm[0] / L, nrm[1] / L, nrm[2] / L];

      // Sens : la nourriture (points colorés) est du côté du dessus
      const r0 = gd.getProp('f_dc_0'), g0 = gd.getProp('f_dc_1'), b0 = gd.getProp('f_dc_2');
      if (r0 && g0 && b0) {
        let above = 0, below = 0, j = 0;
        for (let i = 0; i < N; i += step) {
          if (o && 1 / (1 + Math.exp(-o[i])) < 0.55) continue;
          const rr = 0.5 + 0.2820948 * r0[i], gg = 0.5 + 0.2820948 * g0[i], bb = 0.5 + 0.2820948 * b0[i];
          const sat = Math.max(rr, gg, bb) - Math.min(rr, gg, bb);
          if (sat > 0.14) {
            const d = (xs[j] - centre[0]) * nrm[0] + (ys[j] - centre[1]) * nrm[1] + (zs[j] - centre[2]) * nrm[2];
            if (d > 0) above++; else below++;
          }
          j++;
        }
        if (below > above) nrm = [-nrm[0], -nrm[1], -nrm[2]];
      }

      const extent = Math.max(size[0], size[1], size[2]);
      // Points du cœur (opaques) : serviront à calculer le VRAI contact avec
      // l'assiette, sans être pollués par les halos et le bruit.
      return { centre, size, extent, normal: nrm, pts: { xs, ys, zs } };
    } catch (e) {
      dbg('mesure impossible : ' + e.message, 'bad');
      return null;
    }
  }

  const M = measure(splatAsset);
  if (M) {
    dbg(`mesuré : centre [${M.centre.map(v => v.toFixed(2))}] · taille ${M.extent.toFixed(2)} · normale [${M.normal.map(v => v.toFixed(2))}]`);
  }

  /* ==========================================================
     6-7. POSE DU DRESSAGE + ASSIETTE (recalculables à la volée)
     ----------------------------------------------------------
     Toute la pose est dans applyPose() : elle peut donc être rejouée
     en direct quand on bouge un curseur du mode édition (&edit=1).
     ========================================================== */
  const splat = new pc.Entity(key);
  splat.addComponent('gsplat', { asset: splatAsset });
  pivot.addChild(splat);

  let plate = null;

  // Paramètres de pose (valeurs par défaut = config du plat, surchargées par l'URL)
  const E = dish.euler || [0, 0, 0];
  const PL = dish.plate || {};
  const S = {
    ex:      num('ex', E[0]),
    ey:      num('ey', E[1]),
    ez:      num('ez', E[2]),
    autorot: num('autorot', 1),
    flip:    num('flip', 0),
    fr:      num('fr', PL.foodRatio || 0.36),
    pdepth:  num('pdepth', PL.depth !== undefined ? PL.depth : 0.05),
    sink:    num('sink', PL.sink !== undefined ? PL.sink : 0.05),
    dx:      num('dx', PL.dx || 0),      // décalage horizontal du dressage
    dz:      num('dz', PL.dz || 0),
    zoom:    num('zoom', PL.zoom || 1), // facteur de taille du dressage
  };

  function applyPose() {
    /* --- rotation --- */
    let q = new pc.Quat();
    if (M && S.autorot) {
      const n = M.normal, d = n[1];
      if (d < -0.99999) q.setFromAxisAngle(new pc.Vec3(1, 0, 0), 180);
      else if (d < 0.99999) {
        const ax = new pc.Vec3(-n[2], 0, n[0]).normalize();
        q.setFromAxisAngle(ax, Math.acos(d) * 180 / Math.PI);
      }
    }
    const qm = new pc.Quat().setFromEulerAngles(S.ex, S.ey, S.ez);
    q = new pc.Quat().mul2(qm, q);
    if (S.flip) q = new pc.Quat().mul2(new pc.Quat().setFromEulerAngles(180, 0, 0), q);
    splat.setLocalRotation(q);

    /* --- échelle --- */
    const target = (dish.plate ? FOOD_SIZE * S.fr : FOOD_SIZE) * S.zoom;
    let scale = num('scale', (M && M.extent > 0) ? target / M.extent : 3000);
    if (!Number.isFinite(scale) || scale <= 0) scale = 3000;
    splat.setLocalScale(scale, scale, scale);

    /* --- centrage (le centre mesuré revient à l'origine) --- */
    const c = new pc.Vec3(
      num('cx', M ? M.centre[0] : 0),
      num('cy', M ? M.centre[1] : 0),
      num('cz', M ? M.centre[2] : 0)
    );
    const cw = new pc.Vec3();
    q.transformVector(c, cw);
    splat.setLocalPosition(-cw.x * scale + S.dx, -cw.y * scale, -cw.z * scale + S.dz);

    /* --- contact réel : mesuré sur le CŒUR OPAQUE, jamais sur la bounding
           box (qui inclut les halos et ferait flotter le plat) --- */
    let foodBottom = -300, foodWidth = target, foodHeight = target * 0.4;
    if (M && M.pts) {
      const { xs, ys, zs } = M.pts;
      const tmp = new pc.Vec3(), out = new pc.Vec3();
      const yy = [], rr = [];
      for (let i = 0; i < xs.length; i++) {
        tmp.set(xs[i] - c.x, ys[i] - c.y, zs[i] - c.z);
        q.transformVector(tmp, out);
        yy.push(out.y * scale);
        rr.push(Math.hypot(out.x, out.z) * scale);
      }
      yy.sort((a, b) => a - b);
      rr.sort((a, b) => a - b);
      const at = (a, p) => a[Math.max(0, Math.min(a.length - 1, Math.round(p * (a.length - 1))))];
      foodBottom = at(yy, 0.005);
      foodHeight = at(yy, 0.995) - foodBottom;
      foodWidth = at(rr, 0.97) * 2;
    }

    /* --- assiette --- */
    if (plate) { plate.destroy(); plate = null; }
    const DIA_W = num('pdia', foodWidth / Math.max(0.05, S.fr));

    if (plateAsset) {
      // Vrai bol : mesuré, mis à l'échelle du dressage, posé au contact
      plate = plateAsset.resource.instantiateRenderEntity();
      pivot.addChild(plate);
      const mis = [];
      plate.findComponents('render').forEach((r) => r.meshInstances.forEach((m) => mis.push(m)));
      const bb = mis[0].aabb.clone();
      for (let i = 1; i < mis.length; i++) bb.add(mis[i].aabb);
      const meshDia = Math.max(bb.halfExtents.x, bb.halfExtents.z) * 2;
      const s = DIA_W / meshDia;
      plate.setLocalScale(s, s, s);
      // Le fond intérieur du bol arrive juste sous le dressage
      const floorLocal = (PL.floorRatio !== undefined ? PL.floorRatio : -0.05) * meshDia;
      const GAP = DIA_W * 0.004;
      const y = num('py', foodBottom - GAP + foodHeight * S.sink - floorLocal * s);
      plate.setLocalPosition(0, y, 0);

      const mat = new pc.StandardMaterial();
      mat.diffuse = new pc.Color(1, 1, 1);        // porcelaine blanc pur
      mat.ambient = new pc.Color(1, 1, 1);
      mat.emissive = new pc.Color(0.30, 0.30, 0.31);  // plancher lumineux :
      // aucune zone ne tombe dans le gris, l'assiette reste blanche partout
      mat.gloss = 0.60;
      mat.useMetalness = true;
      mat.metalness = 0;
      mat.cull = pc.CULLFACE_NONE;     // coque ouverte : on affiche les 2 faces
      mat.twoSidedLighting = true;     // sinon les faces retournées noircissent
      mat.depthWrite = true;
      mat.update();
      mis.forEach((m) => { m.material = mat; });

    } else if (dish.plate) {
      const DIA = DIA_W;
      const R = DIA / 2;
      const DEPTH = DIA * S.pdepth;
      const RINGS = 44, SEGS = 96;
      const pos = [], nrm = [], idx = [];
      for (let i = 0; i <= RINGS; i++) {
        const t = i / RINGS, r = R * t, y = DEPTH * t * t;
        const slope = 2 * DEPTH * t / R, nl = Math.hypot(slope, 1);
        for (let s = 0; s <= SEGS; s++) {
          const a = (s / SEGS) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
          pos.push(r * ca, y, r * sa);
          nrm.push(-slope * ca / nl, 1 / nl, -slope * sa / nl);
        }
      }
      for (let i = 0; i < RINGS; i++) {
        for (let s = 0; s < SEGS; s++) {
          const a = i * (SEGS + 1) + s, b = a + SEGS + 1;
          idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
      }
      const mesh = new pc.Mesh(device);
      mesh.setPositions(pos); mesh.setNormals(nrm); mesh.setIndices(idx);
      mesh.update(pc.PRIMITIVE_TRIANGLES);

      const mat = new pc.StandardMaterial();
      const c0 = PL.color || [0.97, 0.96, 0.95];
      mat.diffuse = new pc.Color(c0[0], c0[1], c0[2]);
      mat.gloss = 0.55; mat.useMetalness = true; mat.metalness = 0;
      mat.cull = pc.CULLFACE_NONE; mat.twoSidedLighting = true;
      mat.update();

      plate = new pc.Entity('assiette');
      plate.addComponent('render', { meshInstances: [new pc.MeshInstance(mesh, mat)] });
      pivot.addChild(plate);
      const GAP = DIA * 0.004;
      const y = num('py', foodBottom - GAP + foodHeight * S.sink);
      plate.setLocalPosition(0, y, 0);
    }

    if (info) info.textContent = configText();
    return { scale, foodWidth, foodHeight, foodBottom };
  }

  function configText() {
    return `euler: [${S.ex}, ${S.ey}, ${S.ez}]   autorot: ${S.autorot}   flip: ${S.flip}
plate: { foodRatio: ${S.fr}, depth: ${S.pdepth}, sink: ${S.sink} }
zoom: ${S.zoom}   dx: ${S.dx}   dz: ${S.dz}`;
  }

  /* ==========================================================
     7bis. MODE ÉDITION (&edit=1)
     ----------------------------------------------------------
     Curseurs pour positionner le plat à la main. Les valeurs
     s'affichent en bas : il suffit de les recopier dans la config.
     ========================================================== */
  let info = null;
  if (P.get('edit') === '1') {
    const panel = document.createElement('div');
    panel.id = 'edit';
    panel.innerHTML = '<b>Réglage du plat</b>';
    document.body.appendChild(panel);

    const rows = [
      ['ex', 'Rotation X', -180, 180, 1],
      ['ey', 'Rotation Y', -180, 180, 1],
      ['ez', 'Rotation Z', -180, 180, 1],
      ['zoom', 'Taille', 0.4, 2.5, 0.01],
      ['dx', 'Décalage ←→', -800, 800, 5],
      ['dz', 'Décalage ↑↓', -800, 800, 5],
      ['sink', 'Enfoncement', -0.3, 0.6, 0.01],
      ['fr', 'Assiette (petite→grande)', 0.15, 0.8, 0.01],
      ['pdepth', 'Creux', 0, 0.25, 0.005],
    ];
    rows.forEach(([k, label, min, max, step]) => {
      const row = document.createElement('label');
      const out = document.createElement('span');
      out.className = 'val';
      out.textContent = S[k];
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = S[k];
      inp.addEventListener('input', () => {
        S[k] = parseFloat(inp.value);
        out.textContent = S[k];
        applyPose();
      });
      row.innerHTML = `<span class="lbl">${label}</span>`;
      row.appendChild(inp);
      row.appendChild(out);
      panel.appendChild(row);
    });

    // Mise à plat auto on/off
    const btn = document.createElement('button');
    btn.textContent = 'Mise à plat auto : ' + (S.autorot ? 'ON' : 'OFF');
    btn.onclick = () => {
      S.autorot = S.autorot ? 0 : 1;
      btn.textContent = 'Mise à plat auto : ' + (S.autorot ? 'ON' : 'OFF');
      applyPose();
    };
    panel.appendChild(btn);

    const bflip = document.createElement('button');
    bflip.textContent = 'Retourner (flip)';
    bflip.onclick = () => { S.flip = S.flip ? 0 : 1; applyPose(); };
    panel.appendChild(bflip);

    info = document.createElement('pre');
    info.id = 'cfg';
    panel.appendChild(info);
  }

  applyPose();
  dbg('pose appliquée' + (P.get('edit') === '1' ? ' · mode édition actif' : ''), 'ok');

  /* ==========================================================
     8. Caméra orbitale
     ========================================================== */
  const cam = {
    yaw: 0, elev: ELEV_START, zoom: 1,
    tYaw: 0, tElev: ELEV_START, tZoom: 1, vYaw: 0,
  };
  function place() {
    const d = CAM_DIST * cam.zoom;
    const e = cam.elev * Math.PI / 180, y = cam.yaw * Math.PI / 180;
    camera.setPosition(
      d * Math.cos(e) * Math.sin(y),
      d * Math.sin(e) + LOOK_Y,
      d * Math.cos(e) * Math.cos(y)
    );
    camera.lookAt(0, LOOK_Y, 0);
  }
  place();

  const clampZoom = (z) => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  const pts = new Map();
  let pinch = 0;
  const hint = document.getElementById('hint');

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cam.vYaw = 0;
    hint.classList.add('gone');
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      cam.tYaw += dx * ROT_SPEED;
      cam.vYaw = dx * ROT_SPEED * 0.32;
      cam.tElev = Math.min(ELEV_MAX, Math.max(ELEV_MIN, cam.tElev - dy * ELEV_SPEED));
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch > 0 && d > 0) cam.tZoom = clampZoom(cam.tZoom * (pinch / d));
      pinch = d;
    }
  });
  const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tZoom = clampZoom(cam.tZoom * (1 + Math.sign(e.deltaY) * 0.08));
  }, { passive: false });

  app.on('update', () => {
    cam.tYaw += cam.vYaw;
    cam.vYaw *= FRICTION;
    cam.yaw += (cam.tYaw - cam.yaw) * SMOOTH;
    cam.elev += (cam.tElev - cam.elev) * SMOOTH;
    cam.zoom += (cam.tZoom - cam.zoom) * SMOOTH;
    place();
  });

  /* ==========================================================
     9. MODE CAMÉRA (AR) + CAPTURE PHOTO
     ----------------------------------------------------------
     Le canvas 3D est transparent : en mode caméra, le flux vidéo
     passe derrière et le plat semble posé sur la vraie table.
     La capture recompose vidéo + rendu 3D dans un PNG téléchargeable.
     ========================================================== */
  const video = document.getElementById('video');
  const flash = document.getElementById('flash');
  const btnCam = document.getElementById('btnCam');
  const btnFlip = document.getElementById('btnFlip');
  const btnShot = document.getElementById('btnShot');
  const btnReset = document.getElementById('btnReset');
  let stream = null, facing = 'environment';

  async function startCam() {
    try {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1920 } }, audio: false,
      });
      video.srcObject = stream;
      await video.play();
      document.body.classList.add('cam');
      btnCam.classList.add('on');
      btnFlip.classList.remove('hidden');
    } catch (e) {
      dbg('caméra refusée : ' + e.message, 'bad');
      alert("Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.");
    }
  }
  function stopCam() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    document.body.classList.remove('cam');
    btnCam.classList.remove('on');
    btnFlip.classList.add('hidden');
  }
  btnCam.addEventListener('click', () => (stream ? stopCam() : startCam()));
  btnFlip.addEventListener('click', () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCam();
  });

  btnReset.addEventListener('click', () => {
    cam.tYaw = 0; cam.tElev = ELEV_START; cam.tZoom = 1; cam.vYaw = 0;
  });

  btnShot.addEventListener('click', () => {
    const W = canvas.width, H = canvas.height;
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const g = out.getContext('2d');

    if (stream && video.videoWidth) {
      // fond = image caméra, recadrée comme à l'écran (object-fit: cover)
      const vr = video.videoWidth / video.videoHeight, cr = W / H;
      let sw = video.videoWidth, sh = video.videoHeight, sx = 0, sy = 0;
      if (vr > cr) { sw = video.videoHeight * cr; sx = (video.videoWidth - sw) / 2; }
      else { sh = video.videoWidth / cr; sy = (video.videoHeight - sh) / 2; }
      if (facing === 'user') { g.translate(W, 0); g.scale(-1, 1); }
      g.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
      g.setTransform(1, 0, 0, 1, 0, 0);
    } else {
      // fond = décor studio (dégradé marine)
      const grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#14497a');
      grd.addColorStop(0.45, '#0f3a5e');
      grd.addColorStop(1, '#071c2e');
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
    }

    app.render();                 // force une frame fraîche avant la lecture
    g.drawImage(canvas, 0, 0, W, H);

    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 60);

    out.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `salina-${key}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  });

  app.start();
  setProgress(100);
  setTimeout(() => loader.classList.add('gone'), 250);
  setTimeout(() => hint.classList.add('gone'), 5000);
  dbg('prêt', 'ok');
})();
</script>
</body>
</html>
