<!-- ============================================================
     SALINA · VIEWER 3D — FICHIER UNIQUE (v3)
     ------------------------------------------------------------
     Tout est dans ce fichier : CSS + JS + config des plats.
     Un seul fichier à déployer → aucun décalage de cache possible.

     NOUVEAUTÉS v3.1 :
       · ASSIETTE RÉELLE (.glb) : chaque plat peut référencer un scan
         d'assiette normalisé (plate.glb). Convention du fichier :
         diamètre = 1.0, fond du creux à y = 0 (pipeline
         plate_normalizer.py). Repli automatique sur l'assiette
         générée si le .glb ne charge pas.

     NOUVEAUTÉS v3 (correction "plat couché") :
       1. AUTO-POSE ROBUSTE : l'orientation n'est plus déduite du plan
          dominant de tout le nuage (fragile : murs, fond, floaters),
          mais de la GÉOMÉTRIE DES POINTS COLORÉS (la nourriture),
          après filtrage du cluster central. Validé offline :
          erreur < 2° sur scènes complètes, nourriture seule,
          floaters adjacents, plats hauts (repli plan assiette).
       2. NETTOYAGE À LA VOLÉE (&clean=1, défaut ON en mode assiette 3D) :
          les gaussiennes hors du volume de la nourriture (voiles,
          fond, assiette capturée) sont masquées avant le rendu.
       3. CALIBRATION LIVE (&debug=1) : boutons X/Y/Z ±5°, flip,
          lecture directe des valeurs à coller dans DISHES ou l'URL.
          Le contact assiette est recalculé à chaque retouche.

     DEUX TYPES DE PLATS :
       A. splat seul        → le .ply contient nourriture + assiette
       B. splat + assiette  → assiette = mesh généré, aucun trou possible

     DEBUG : ajouter &debug=1 à l'URL → panneau d'état + calibration.
     ============================================================ -->
<style>
  :root {
    --marine-deep: #0f3a5e;
    --marine:      #14497a;
    --night:       #071c2e;
    --cream:       #f4f1ea;
    --gold:        #c8a45a;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans:  'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--night);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* Le canvas est transparent : le fond ci-dessous se voit à travers
     les zones sans gaussiennes. */
  #stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% -5%, rgba(125,180,221,0.22), transparent 60%),
      radial-gradient(ellipse 70% 45% at 100% 100%, rgba(200,164,90,0.10), transparent 55%),
      linear-gradient(180deg, var(--marine) 0%, var(--marine-deep) 45%, var(--night) 100%);
  }
  #canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }

  /* ---------- UI ---------- */
  .pill {
    position: fixed; z-index: 10;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 18px;
    background: rgba(7, 28, 46, 0.55);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 100px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; text-decoration: none;
  }
  #back {
    top: max(16px, env(safe-area-inset-top)); left: 16px;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
  }
  #back svg { width: 15px; height: 15px; }
  #label {
    top: max(16px, env(safe-area-inset-top)); right: 16px;
    flex-direction: column; align-items: flex-end; gap: 1px;
    padding: 10px 18px; text-align: right;
  }
  #label .n { font-family: var(--font-serif); font-style: italic; font-size: 17px; }
  #label .p { font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.62); }

  #hint {
    position: fixed; z-index: 10;
    bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
    left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.55); white-space: nowrap;
    transition: opacity 0.6s ease; pointer-events: none;
  }
  #hint.gone { opacity: 0; }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--marine-deep);
    transition: opacity 0.5s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader .mark {
    font-family: var(--font-serif); font-size: 34px; font-style: italic;
    color: var(--cream); letter-spacing: 0.04em;
  }
  #loader .sub {
    margin: 8px 0 30px;
    font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  #bar { width: 168px; height: 2px; background: rgba(255,255,255,0.16); border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.25s ease; }
  #err {
    margin-top: 22px; max-width: 300px; text-align: center;
    font-family: var(--font-serif); font-style: italic; font-size: 15px;
    color: #ffb4a2; line-height: 1.5; display: none;
  }

  /* ---------- Debug (&debug=1) ---------- */
  #debug {
    position: fixed; z-index: 100; left: 10px; bottom: 10px;
    max-width: min(92vw, 460px); max-height: 40vh; overflow: auto;
    padding: 10px 12px;
    background: rgba(0,0,0,0.82); color: #9fe;
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    border-radius: 8px; white-space: pre-wrap; display: none;
  }
  #debug .ok  { color: #7ee787; }
  #debug .bad { color: #ff7b72; }
  #debug .wrn { color: #f0c674; }

  /* ---------- Calibration (&debug=1) ---------- */
  #calib {
    position: fixed; z-index: 100; right: 10px; bottom: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.82);
    border-radius: 8px; display: none;
    font: 11px/1.5 ui-monospace, Menlo, monospace; color: #9fe;
    max-width: min(92vw, 260px);
  }
  #calib .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  #calib .ax { width: 14px; color: #f0c674; }
  #calib button {
    flex: 1; padding: 7px 0; min-width: 42px;
    background: rgba(255,255,255,0.10); color: #fff;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 6px;
    font: 12px ui-monospace, Menlo, monospace; cursor: pointer;
    touch-action: manipulation;
  }
  #calib button:active { background: rgba(255,255,255,0.28); }
  #calib .out {
    margin-top: 4px; padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.15);
    color: #7ee787; user-select: all; -webkit-user-select: all;
    word-break: break-all;
  }
</style>

<body>

<div id="stage"></div>
<canvas id="canvas"></canvas>

<a id="back" class="pill" href="carte.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<div id="label" class="pill">

<div id="calib">
  <div class="row"><span class="ax">X</span><button data-a="x" data-d="-5">−5</button><button data-a="x" data-d="5">+5</button><button data-a="x" data-d="-45">−45</button><button data-a="x" data-d="45">+45</button></div>
  <div class="row"><span class="ax">Y</span><button data-a="y" data-d="-5">−5</button><button data-a="y" data-d="5">+5</button><button data-a="y" data-d="-45">−45</button><button data-a="y" data-d="45">+45</button></div>
  <div class="row"><span class="ax">Z</span><button data-a="z" data-d="-5">−5</button><button data-a="z" data-d="5">+5</button><button data-a="z" data-d="-45">−45</button><button data-a="z" data-d="45">+45</button></div>
  <div class="row"><button id="cFlip">flip 180°</button><button id="cReset">reset</button></div>
  <div class="out" id="cOut">&amp;ex=0&amp;ey=0&amp;ez=0</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.10.0/build/playcanvas.min.js"></script>
<script>
(async function () {
  'use strict';

  /* ==========================================================
     1. CONFIGURATION DES PLATS
     ----------------------------------------------------------
     Pour AJOUTER un plat :
       1. Uploader le .ply sur R2 (dossier Salina/)
       2. Ajouter une entrée ici
       3. Mettre splat:"laClé" sur le plat dans salina-menu.html

     Deux modes :
       · sans "plate"  → le .ply contient nourriture + assiette.
       · avec "plate"  → assiette = mesh généré. Le nuage est
                         redressé et nettoyé automatiquement.

     Réglages par plat (tous surchargeables par l'URL) :
       euler: [x,y,z]  retouche manuelle après auto-pose (&ex &ey &ez)
       autorot: 0      désactive l'auto-pose (défaut 1)      (&autorot)
       clean: 0        désactive le nettoyage (défaut 1 si plate) (&clean)
     ========================================================== */
  const R2 = 'https://pub-cb6130d8c47d41edaef19f32291a50d2.r2.dev/Salina';

  const DISHES = {
    // ---- Mode SPLAT + ASSIETTE 3D (recommandé) ----
    thon: {
      name: 'Thon',
      price: '28 €',
      ply: R2 + '/thon.ply',            // PLY d'origine (le nettoyage coûtait des détails)
      // Orientation : auto-pose v3 (axes calculés sur la nourriture).
      // Si besoin d'un dernier degré : calibrer avec &debug=1 puis
      // coller ici les valeurs affichées par le panneau.
      euler: [0, 0, 0],
      // Assiette RÉELLE (scan .glb normalisé par plate_normalizer.py :
      // ø = 1.0, fond du creux à y = 0). Si le .glb ne charge pas,
      // le viewer retombe sur l'assiette générée ci-dessous.
      plate: {
        glb: R2 + '/assiette1.glb',   // ← uploader le fichier sur R2
        foodRatio: 0.36,  // largeur dressage ÷ diamètre assiette → &fr=
        depth: 0.05,      // creux de l'assiette générée (repli)  → &pdepth=
        sink: 0.14,       // enfoncement du dressage dans le creux → &sink=
        color: [0.97, 0.96, 0.95],   // porcelaine blanche (repli)
      },
    },

    // ---- Mode SPLAT SEUL (le .ply contient déjà l'assiette) ----
    tacos:   { name: 'Tacos Saumon', price: '20 €', ply: R2 + '/tacos.ply' },
    saumon:  { name: 'Saumon',       price: '26 €', ply: R2 + '/tartare-2.ply' },
    pasta:   { name: 'Spaghetto alla chitarra', price: '38 €', ply: R2 + '/pates.ply' },
    dessert: { name: 'Cannolo Sicilien',        price: '15 €', ply: R2 + '/canolo.ply' },
  };

  /* ---------- Mise en scène ---------- */
  const FOV        = 45;
  const CAM_DIST   = 10000;   // distance d'orbite
  const LOOK_Y     = 0;       // la caméra vise l'origine
  const ELEV_START = 46, ELEV_MIN = 30, ELEV_MAX = 70;
  const ZOOM_MIN   = 0.55, ZOOM_MAX = 1.7;
  const ROT_SPEED  = 0.6, ELEV_SPEED = 0.30;
  const SMOOTH     = 0.25, FRICTION = 0.94;
  const FOOD_SIZE  = 2300;    // largeur cible d'un plat sans assiette

  /* ==========================================================
     2. Paramètres URL & debug
     ========================================================== */
  const P = new URLSearchParams(location.search);
  const num = (k, fb) => { const n = parseFloat(P.get(k)); return Number.isFinite(n) ? n : fb; };
  const key = DISHES[P.get('dish')] ? P.get('dish') : 'thon';
  const dish = DISHES[key];

  const DEBUG = P.get('debug') === '1';
  const dbgEl = document.getElementById('debug');
  const lines = [];
  function render() { if (DEBUG) { dbgEl.style.display = 'block'; dbgEl.innerHTML = lines.join('\n'); } }
  function dbg(msg, cls) {
    lines.push(cls ? `<span class="${cls}">${msg}</span>` : msg);
    render();
    console.log('[salina]', msg);
  }
  dbg('viewer v3.1');
  dbg(`plat = ${key}`);

  document.getElementById('dishName').textContent = dish.name;
  document.getElementById('dishPrice').textContent = dish.price;
  document.title = `Salina · ${dish.name} en 3D`;

  const fill = document.getElementById('fill');
  const loader = document.getElementById('loader');
  const errEl = document.getElementById('err');
  const setProgress = (p) => { fill.style.width = Math.max(0, Math.min(100, p)) + '%'; };
  function fatal(msg) {
    errEl.style.display = 'block';
    errEl.textContent = msg;
    dbg('FATAL: ' + msg, 'bad');
  }

  /* ==========================================================
     3. Initialisation PlayCanvas
     ========================================================== */
  const canvas = document.getElementById('canvas');
  let device;
  try {
    device = await pc.createGraphicsDevice(canvas, { deviceTypes: ['webgl2'], antialias: true, alpha: true });
  } catch (e) {
    fatal('3D non supportée sur cet appareil.'); return;
  }
  device.maxPixelRatio = Math.min(window.devicePixelRatio || 1, 2);

  const app = new pc.AppBase(canvas);
  const opts = new pc.AppOptions();
  opts.graphicsDevice = device;
  opts.componentSystems = [
    pc.RenderComponentSystem,     // meshes (assiette générée)
    pc.CameraComponentSystem,
    pc.LightComponentSystem,      // éclairage des meshes
    pc.GSplatComponentSystem,     // gaussian splats
  ];
  opts.resourceHandlers = [
    pc.TextureHandler,
    pc.ContainerHandler,          // .glb
    pc.GSplatHandler,             // .ply
  ];
  app.init(opts);
  app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
  app.setCanvasResolution(pc.RESOLUTION_AUTO);
  window.addEventListener('resize', () => app.resizeCanvas());

  // Caméra : fond transparent (le dégradé CSS se voit à travers les trous)
  const camera = new pc.Entity('camera');
  camera.addComponent('camera', {
    clearColor: new pc.Color(0, 0, 0, 0),
    fov: FOV, nearClip: 10, farClip: 200000,
  });
  app.root.addChild(camera);

  // Éclairage (n'affecte QUE les meshes ; les splats portent leur propre couleur)
  app.scene.ambientLight = new pc.Color(0.62, 0.62, 0.60);
  const sun = new pc.Entity('sun');
  sun.addComponent('light', { type: 'directional', intensity: 1.1, castShadows: false });
  sun.setEulerAngles(58, 30, 0);
  app.root.addChild(sun);

  const pivot = new pc.Entity('pivot');
  app.root.addChild(pivot);

  dbg('moteur 3D initialisé', 'ok');

  /* ==========================================================
     4. Chargement du splat (.ply)
     ========================================================== */
  function loadAsset(url, type, name) {
    return new Promise((resolve, reject) => {
      const asset = new pc.Asset(name, type, { url: url });
      asset.once('load', () => resolve(asset));
      asset.once('error', (e) => reject(new Error(String(e))));
      app.assets.add(asset);
      app.assets.load(asset);
      if (type === 'gsplat') {
        asset.on('progress', (r, t) => { if (t > 0) setProgress(10 + (r / t) * 80); });
      }
    });
  }

  let splatAsset;
  try {
    splatAsset = await loadAsset(dish.ply, 'gsplat', key);
    dbg('splat chargé : ' + dish.ply.split('/').pop(), 'ok');
  } catch (e) {
    fatal("Le modèle 3D n'a pas pu être chargé.");
    dbg('erreur splat : ' + dish.ply + ' → ' + e.message, 'bad');
    return;
  }

  setProgress(94);

  // Assiette réelle (.glb) : chargement NON bloquant — en cas d'échec,
  // l'assiette générée prend le relais (le client voit toujours un plat).
  let plateGlb = null;
  if (dish.plate && dish.plate.glb) {
    try {
      plateGlb = await loadAsset(dish.plate.glb, 'container', key + '-assiette');
      dbg('assiette chargée : ' + dish.plate.glb.split('/').pop(), 'ok');
    } catch (e) {
      dbg('assiette .glb indisponible (' + e.message + ') → assiette générée', 'wrn');
    }
  }

  /* ==========================================================
     5. Mesure du nuage (auto-pose v3)
     ----------------------------------------------------------
     Étapes :
       a) échantillonner les gaussiennes opaques (+ saturation couleur)
       b) filtrer le CLUSTER CENTRAL (médiane + rayon 3×dist médiane)
          → élimine murs, fond de pièce, floaters lointains
       c) axes principaux (Jacobi) calculés sur les POINTS COLORÉS
          (la nourriture) → immunisé contre l'assiette/table/voiles
       d) axe vertical = celui qui minimise hauteur/largeur du dressage
          (un plat dressé est toujours bien plus large que haut)
       e) si ratio > 0.75 (plat haut type burger) → repli : plan
          dominant du cluster complet (l'assiette/table)
       f) sens : la nourriture colorée est AU-DESSUS du reste
     ========================================================== */
  const SAT_MIN = 0.14;   // seuil "point coloré = nourriture"

  function jacobiAxes(xs, ys, zs, c) {
    // Covariance 3×3 puis diagonalisation de Jacobi.
    // Retourne { axes:[[x,y,z]×3] (normés), vals:[λ0,λ1,λ2] }.
    const n = xs.length;
    let xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
    for (let i = 0; i < n; i++) {
      const dx = xs[i] - c[0], dy = ys[i] - c[1], dz = zs[i] - c[2];
      xx += dx * dx; xy += dx * dy; xz += dx * dz; yy += dy * dy; yz += dy * dz; zz += dz * dz;
    }
    const A = [[xx / n, xy / n, xz / n], [xy / n, yy / n, yz / n], [xz / n, yz / n, zz / n]];
    const V = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
    for (let it = 0; it < 30; it++) {
      let p = 0, q = 1;
      if (Math.abs(A[0][2]) > Math.abs(A[p][q])) { p = 0; q = 2; }
      if (Math.abs(A[1][2]) > Math.abs(A[p][q])) { p = 1; q = 2; }
      if (Math.abs(A[p][q]) < 1e-12) break;
      const th = (A[q][q] - A[p][p]) / (2 * A[p][q]);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
      const co = 1 / Math.sqrt(t * t + 1), si = t * co;
      const app_ = A[p][p], aqq = A[q][q], apq = A[p][q];
      A[p][p] = co * co * app_ - 2 * si * co * apq + si * si * aqq;
      A[q][q] = si * si * app_ + 2 * si * co * apq + co * co * aqq;
      A[p][q] = A[q][p] = 0;
      for (let k = 0; k < 3; k++) {
        if (k !== p && k !== q) {
          const akp = A[k][p], akq = A[k][q];
          A[k][p] = A[p][k] = co * akp - si * akq;
          A[k][q] = A[q][k] = si * akp + co * akq;
        }
        const vkp = V[k][p], vkq = V[k][q];
        V[k][p] = co * vkp - si * vkq;
        V[k][q] = si * vkp + co * vkq;
      }
    }
    const axes = [], vals = [];
    for (let j = 0; j < 3; j++) {
      let a = [V[0][j], V[1][j], V[2][j]];
      const L = Math.hypot(a[0], a[1], a[2]) || 1;
      axes.push([a[0] / L, a[1] / L, a[2] / L]);
      vals.push(A[j][j]);
    }
    return { axes, vals };
  }

  function measure(asset) {
    try {
      const gd = asset.resource.gsplatData || asset.resource.splatData;
      const N = gd && gd.numSplats;
      if (!gd || !gd.getProp || !N) return null;
      const X = gd.getProp('x'), Y = gd.getProp('y'), Z = gd.getProp('z'), O = gd.getProp('opacity');
      if (!X || !Y || !Z) return null;
      const R0 = gd.getProp('f_dc_0'), G0 = gd.getProp('f_dc_1'), B0 = gd.getProp('f_dc_2');
      const hasColor = !!(R0 && G0 && B0);

      // a) échantillonnage des points opaques
      const step = Math.max(1, Math.floor(N / 30000));
      const axs = [], ays = [], azs = [], ast = [];
      for (let i = 0; i < N; i += step) {
        if (O && 1 / (1 + Math.exp(-O[i])) < 0.55) continue;
        axs.push(X[i]); ays.push(Y[i]); azs.push(Z[i]);
        if (hasColor) {
          const r = 0.5 + 0.2820948 * R0[i], g = 0.5 + 0.2820948 * G0[i], b = 0.5 + 0.2820948 * B0[i];
          ast.push(Math.max(r, g, b) - Math.min(r, g, b));
        } else ast.push(0);
      }
      if (axs.length < 200) return null;

      const med = (a) => { const s = a.slice().sort((p, q) => p - q); return s[s.length >> 1]; };
      const pctS = (s, p) => s[Math.max(0, Math.min(s.length - 1, Math.round(p * (s.length - 1))))];

      // b) filtre du cluster central
      const mx = med(axs), my = med(ays), mz = med(azs);
      const dist = new Array(axs.length);
      for (let i = 0; i < axs.length; i++) dist[i] = Math.hypot(axs[i] - mx, ays[i] - my, azs[i] - mz);
      const keepR = 3 * med(dist);
      const xs = [], ys = [], zs = [], st = [];
      for (let i = 0; i < axs.length; i++) {
        if (dist[i] <= keepR) { xs.push(axs[i]); ys.push(ays[i]); zs.push(azs[i]); st.push(ast[i]); }
      }
      if (xs.length < 200) return null;

      const sx = xs.slice().sort((p, q) => p - q);
      const sy = ys.slice().sort((p, q) => p - q);
      const sz = zs.slice().sort((p, q) => p - q);
      const centre = [
        (pctS(sx, 0.02) + pctS(sx, 0.98)) / 2,
        (pctS(sy, 0.02) + pctS(sy, 0.98)) / 2,
        (pctS(sz, 0.02) + pctS(sz, 0.98)) / 2,
      ];
      const size = [
        pctS(sx, 0.98) - pctS(sx, 0.02),
        pctS(sy, 0.98) - pctS(sy, 0.02),
        pctS(sz, 0.98) - pctS(sz, 0.02),
      ];
      const extent = Math.max(size[0], size[1], size[2]);

      // c) sous-ensemble "nourriture" (points colorés)
      const fxs = [], fys = [], fzs = [];
      for (let i = 0; i < xs.length; i++) {
        if (st[i] > SAT_MIN) { fxs.push(xs[i]); fys.push(ys[i]); fzs.push(zs[i]); }
      }
      const useFood = fxs.length >= 300;
      const gx = useFood ? fxs : xs, gy = useFood ? fys : ys, gz = useFood ? fzs : zs;
      const gc = [med(gx), med(gy), med(gz)];

      // d) axe vertical = min(hauteur/largeur) sur la nourriture
      const eig = jacobiAxes(gx, gy, gz, gc);
      const extAlong = (a) => {
        const t = new Array(gx.length);
        for (let i = 0; i < gx.length; i++)
          t[i] = (gx[i] - gc[0]) * a[0] + (gy[i] - gc[1]) * a[1] + (gz[i] - gc[2]) * a[2];
        t.sort((p, q) => p - q);
        return pctS(t, 0.99) - pctS(t, 0.01);
      };
      const exts = eig.axes.map(extAlong);
      let up = null, bestRatio = Infinity;
      for (let i = 0; i < 3; i++) {
        const w = Math.max(exts[(i + 1) % 3], exts[(i + 2) % 3], 1e-9);
        const r = exts[i] / w;
        if (r < bestRatio) { bestRatio = r; up = eig.axes[i]; }
      }
      let mode = useFood ? 'nourriture' : 'cluster';

      // e) plat haut / ambigu → repli : plan dominant du cluster complet
      if (bestRatio > 0.75) {
        const eigAll = jacobiAxes(xs, ys, zs, centre);
        let mi = 0;
        if (eigAll.vals[1] < eigAll.vals[mi]) mi = 1;
        if (eigAll.vals[2] < eigAll.vals[mi]) mi = 2;
        up = eigAll.axes[mi];
        mode = 'plan dominant (plat haut)';
      }

      // f) sens : la nourriture colorée est au-dessus du plan
      const proj = (px, py, pz) =>
        (px - centre[0]) * up[0] + (py - centre[1]) * up[1] + (pz - centre[2]) * up[2];
      let upConfident = false;
      if (useFood) {
        const tAll = new Array(xs.length);
        for (let i = 0; i < xs.length; i++) tAll[i] = proj(xs[i], ys[i], zs[i]);
        const tFood = new Array(fxs.length);
        for (let i = 0; i < fxs.length; i++) tFood[i] = proj(fxs[i], fys[i], fzs[i]);
        const dAll = med(tAll), dFood = med(tFood);
        if (Math.abs(dFood - dAll) > 0.03 * extent) {
          if (dFood < dAll) up = [-up[0], -up[1], -up[2]];
          upConfident = true;
        }
      }
      if (!upConfident) {
        // Repli : le dessous d'un dressage est plat et dense → la médiane
        // est plus proche du bas que du haut. Sinon &flip=1.
        const tF = new Array(gx.length);
        for (let i = 0; i < gx.length; i++) tF[i] = proj(gx[i], gy[i], gz[i]);
        tF.sort((p, q) => p - q);
        const lo = pctS(tF, 0.5) - pctS(tF, 0.02);
        const hi = pctS(tF, 0.98) - pctS(tF, 0.5);
        if (lo > hi * 1.15) up = [-up[0], -up[1], -up[2]];
      }

      return {
        centre, size, extent,
        up, ratio: bestRatio, mode, upConfident,
        pts: { xs, ys, zs, st },
      };
    } catch (e) {
      dbg('mesure impossible : ' + e.message, 'bad');
      return null;
    }
  }

  const M = measure(splatAsset);
  if (M) {
    dbg(`mesuré : centre [${M.centre.map(v => v.toFixed(2))}] · taille ${M.extent.toFixed(2)}`);
    dbg(`axe vertical [${M.up.map(v => v.toFixed(2))}] · via ${M.mode} · ratio h/l ${M.ratio.toFixed(2)}`);
    if (!M.upConfident) dbg('sens haut/bas estimé — si le plat est à l\'envers : &flip=1', 'wrn');
  } else {
    dbg('mesure indisponible → pose brute du PLY', 'bad');
  }

  /* ==========================================================
     6. Quaternion d'auto-pose + nettoyage des gaussiennes
     ========================================================== */
  const AUTOROT = num('autorot', dish.autorot !== undefined ? dish.autorot : 1) === 1;

  function autoQuat() {
    const q = new pc.Quat();
    if (M && AUTOROT) {
      const n = M.up, d = n[1];
      if (d < -0.99999) q.setFromAxisAngle(new pc.Vec3(1, 0, 0), 180);
      else if (d < 0.99999) {
        const ax = new pc.Vec3(-n[2], 0, n[0]).normalize();   // n × +Y
        q.setFromAxisAngle(ax, Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI);
      }
    }
    return q;
  }

  /* Métriques de la NOURRITURE dans le repère redressé (unités PLY).
     Servent au nettoyage et au contact assiette. */
  function foodMetrics(q) {
    if (!M || !M.pts) return null;
    const { xs, ys, zs, st } = M.pts;
    const idx = [];
    for (let i = 0; i < xs.length; i++) if (st[i] > SAT_MIN) idx.push(i);
    const use = idx.length >= 300 ? idx : xs.map((_, i) => i);
    const tmp = new pc.Vec3(), out = new pc.Vec3();
    const yy = [], rr = [];
    for (const i of use) {
      tmp.set(xs[i] - M.centre[0], ys[i] - M.centre[1], zs[i] - M.centre[2]);
      q.transformVector(tmp, out);
      yy.push(out.y);
      rr.push(Math.hypot(out.x, out.z));
    }
    yy.sort((a, b) => a - b);
    rr.sort((a, b) => a - b);
    const at = (arr, p) => arr[Math.max(0, Math.min(arr.length - 1, Math.round(p * (arr.length - 1))))];
    const bottom = at(yy, 0.01), top = at(yy, 0.995);
    return { bottom, top, height: Math.max(top - bottom, 1e-9), radius: at(rr, 0.97) };
  }

  /* Nettoyage : masque (opacité → 0) toute gaussienne hors du volume
     de la nourriture. Doit s'exécuter AVANT la création du composant
     gsplat (les textures GPU sont construites à ce moment-là).
       &clean=0     désactive
       &cleanr=1.35 rayon toléré (× rayon nourriture)
       &cleanb=0.10 marge sous le contact (× hauteur)
       &cleant=0.90 marge au-dessus du sommet (× hauteur)   */
  const CLEAN = num('clean', dish.clean !== undefined ? dish.clean : (dish.plate ? 1 : 0));
  if (M && AUTOROT && CLEAN > 0) {
    try {
      const gd = splatAsset.resource.gsplatData || splatAsset.resource.splatData;
      const X = gd.getProp('x'), Y = gd.getProp('y'), Z = gd.getProp('z'), O = gd.getProp('opacity');
      const q0 = autoQuat();
      const fm = foodMetrics(q0);
      if (X && Y && Z && O && fm) {
        const rMax = num('cleanr', 1.35) * fm.radius;
        const yMin = fm.bottom - num('cleanb', 0.10) * fm.height;
        const yMax = fm.top + num('cleant', 0.90) * fm.height;
        const tmp = new pc.Vec3(), out = new pc.Vec3();
        let muted = 0;
        for (let i = 0; i < gd.numSplats; i++) {
          tmp.set(X[i] - M.centre[0], Y[i] - M.centre[1], Z[i] - M.centre[2]);
          q0.transformVector(tmp, out);
          if (Math.hypot(out.x, out.z) > rMax || out.y < yMin || out.y > yMax) {
            O[i] = -12;   // sigmoïde(−12) ≈ 0 → invisible
            muted++;
          }
        }
        dbg(`nettoyage : ${muted} splats masqués (${(100 * muted / gd.numSplats).toFixed(0)}%) · rayon ${rMax.toFixed(2)}`, 'ok');
      }
    } catch (e) {
      dbg('nettoyage impossible : ' + e.message, 'wrn');
    }
  }

  /* ==========================================================
     7. Pose du splat + assiette générée (re-calculable)
     ========================================================== */
  const splat = new pc.Entity(key);
  splat.addComponent('gsplat', { asset: splatAsset });   // APRÈS le nettoyage
  pivot.addChild(splat);

  const E = dish.euler || [0, 0, 0];
  const man = { x: num('ex', E[0]), y: num('ey', E[1]), z: num('ez', E[2]) };
  let FLIP = num('flip', 0) ? 1 : 0;

  let plateEnt = null;
  let poseMark = -1;   // les lignes de debug de la pose sont réécrites, pas empilées

  function renderAabb(root) {
    // AABB combinée de tous les meshes d'une entité (échelle identité)
    root.syncHierarchy();
    let bb = null;
    for (const rc of root.findComponents('render')) {
      for (const mi of rc.meshInstances) {
        if (!bb) { bb = new pc.BoundingBox(); bb.copy(mi.aabb); }
        else bb.add(mi.aabb);
      }
    }
    return bb;
  }

  function buildPlate(foodWidth, foodBottom, foodHeight, FR) {
    const cfg = dish.plate;
    const DIA = num('pdia', foodWidth / FR);
    const R = DIA / 2;

    /* Pose commune aux deux modes : le FOND DU CREUX (y local = 0,
       convention du .glb normalisé comme de l'assiette générée) arrive
       juste sous le point de contact du dressage. */
    const GAP = DIA * 0.004;
    const sink = num('sink', cfg.sink !== undefined ? cfg.sink : 0.02);
    const y = num('py', foodBottom - GAP + foodHeight * sink);

    // ---- A. Assiette RÉELLE (.glb normalisé : ø = 1, creux à y = 0) ----
    if (plateGlb) {
      try {
        plateEnt = plateGlb.resource.instantiateRenderEntity();
        pivot.addChild(plateEnt);
        const bb = renderAabb(plateEnt);
        let dGlb = bb ? Math.max(bb.halfExtents.x, bb.halfExtents.z) * 2 : 1;
        if (!(dGlb > 0.01)) dGlb = 1;
        if (Math.abs(dGlb - 1) > 0.05) {
          dbg(`glb non normalisé (ø ${dGlb.toFixed(2)}) → échelle corrigée`, 'wrn');
        }
        const s = DIA / dGlb;
        plateEnt.setLocalScale(s, s, s);
        plateEnt.setLocalPosition(0, y, 0);
        const rim = bb ? (bb.center.y + bb.halfExtents.y) * s : 0;
        dbg(`assiette réelle : ø ${DIA.toFixed(0)} · bord +${rim.toFixed(0)} · y=${y.toFixed(0)}`, 'ok');
        return;
      } catch (e) {
        if (plateEnt) { plateEnt.destroy(); plateEnt = null; }
        dbg('instanciation .glb impossible (' + e.message + ') → assiette générée', 'wrn');
      }
    }

    // ---- B. Assiette GÉNÉRÉE (surface de révolution — repli) ----
    const DEPTH = DIA * num('pdepth', cfg.depth !== undefined ? cfg.depth : 0.16);

    const RINGS = 44, SEGS = 96;
    const pos = [], nrm = [], idx = [];
    for (let i = 0; i <= RINGS; i++) {
      const t = i / RINGS;
      const r = R * t;
      const y = DEPTH * t * t;                 // profil du creux
      const slope = 2 * DEPTH * t / R;         // dy/dr
      const nl = Math.hypot(slope, 1);
      for (let s = 0; s <= SEGS; s++) {
        const a = (s / SEGS) * Math.PI * 2;
        const ca = Math.cos(a), sa = Math.sin(a);
        pos.push(r * ca, y, r * sa);
        nrm.push(-slope * ca / nl, 1 / nl, -slope * sa / nl);
      }
    }
    for (let i = 0; i < RINGS; i++) {
      for (let s = 0; s < SEGS; s++) {
        const a = i * (SEGS + 1) + s, b = a + SEGS + 1;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
      }
    }

    const mesh = new pc.Mesh(device);
    mesh.setPositions(pos);
    mesh.setNormals(nrm);
    mesh.setIndices(idx);
    mesh.update(pc.PRIMITIVE_TRIANGLES);

    const mat = new pc.StandardMaterial();
    const c0 = cfg.color || [0.93, 0.91, 0.87];
    mat.diffuse = new pc.Color(c0[0], c0[1], c0[2]);
    mat.gloss = 0.55;
    mat.useMetalness = true;
    mat.metalness = 0;
    mat.cull = pc.CULLFACE_NONE;        // visible du dessus ET du dessous
    mat.twoSidedLighting = true;
    mat.update();

    plateEnt = new pc.Entity('assiette');
    plateEnt.addComponent('render', { meshInstances: [new pc.MeshInstance(mesh, mat)] });
    pivot.addChild(plateEnt);

    plateEnt.setLocalPosition(0, y, 0);

    dbg(`assiette générée : ø ${DIA.toFixed(0)} · creux ${DEPTH.toFixed(0)} · y=${y.toFixed(0)}`, 'ok');
  }

  function applyPose() {
    if (poseMark >= 0) { lines.length = poseMark; } else { poseMark = lines.length; }

    // Rotation : auto-pose, puis retouche manuelle, puis flip éventuel.
    let q = autoQuat();
    const qm = new pc.Quat().setFromEulerAngles(man.x, man.y, man.z);
    q = new pc.Quat().mul2(qm, q);
    if (FLIP) q = new pc.Quat().mul2(new pc.Quat().setFromEulerAngles(180, 0, 0), q);
    splat.setLocalRotation(q);

    // Échelle. FOOD_SIZE = largeur totale visée dans la scène.
    const FR = num('fr', (dish.plate && dish.plate.foodRatio) || 0.5);
    const target = dish.plate ? FOOD_SIZE * FR : FOOD_SIZE;
    let scale = num('scale', (M && M.extent > 0) ? target / M.extent : 3000);
    if (!Number.isFinite(scale) || scale <= 0) {
      scale = 3000;
      dbg('échelle invalide → repli sur 3000', 'bad');
    }
    splat.setLocalScale(scale, scale, scale);

    // Centrage : le centre mesuré est ramené à l'origine
    const c = new pc.Vec3(num('cx', M ? M.centre[0] : 0), num('cy', M ? M.centre[1] : 0), num('cz', M ? M.centre[2] : 0));
    const cw = new pc.Vec3();
    q.transformVector(c, cw);
    splat.setLocalPosition(-cw.x * scale, -cw.y * scale, -cw.z * scale);
    dbg(`splat : échelle ${scale.toFixed(0)} · auto-pose ${(M && AUTOROT) ? 'oui' : 'non'} · euler [${man.x},${man.y},${man.z}]${FLIP ? ' · flip' : ''}`);

    /* Contact réel avec l'assiette — mesuré sur la nourriture (points
       colorés) transformée par la pose FINALE, insensible aux floaters
       et à l'assiette/table capturées. */
    let foodBottom = -300, foodWidth = target, foodHeight = target * 0.4;
    const fm = foodMetrics(q);
    if (fm) {
      foodBottom = fm.bottom * scale;
      foodHeight = fm.height * scale;
      foodWidth = fm.radius * 2 * scale;
      dbg(`nourriture : largeur ${foodWidth.toFixed(0)} · hauteur ${foodHeight.toFixed(0)} · contact y=${foodBottom.toFixed(0)}`);
      if (foodHeight > foodWidth * 0.9) {
        dbg('orientation suspecte (plus haut que large) → calibrer avec les boutons ou &flip=1', 'wrn');
      }
    } else {
      dbg('mesure du cœur indisponible → valeurs par défaut', 'bad');
    }

    if (dish.plate) {
      if (plateEnt) { plateEnt.destroy(); plateEnt = null; }
      buildPlate(foodWidth, foodBottom, foodHeight, FR);
    }
  }

  applyPose();

  /* ==========================================================
     8. Calibration live (&debug=1)
     ----------------------------------------------------------
     Ajuster X/Y/Z jusqu'à ce que le plat soit posé, puis copier la
     ligne verte : soit dans l'URL, soit dans DISHES.<plat>.euler.
     Le contact et l'assiette sont recalculés à chaque clic.
     ========================================================== */
  const calibEl = document.getElementById('calib');
  const cOut = document.getElementById('cOut');
  function calibOut() {
    cOut.textContent = `&ex=${man.x}&ey=${man.y}&ez=${man.z}${FLIP ? '&flip=1' : ''}  |  euler: [${man.x}, ${man.y}, ${man.z}]`;
  }
  if (DEBUG) {
    calibEl.style.display = 'block';
    calibOut();
    calibEl.querySelectorAll('button[data-a]').forEach((b) => {
      b.addEventListener('click', () => {
        man[b.dataset.a] = ((man[b.dataset.a] + parseFloat(b.dataset.d)) % 360 + 360) % 360;
        if (man[b.dataset.a] > 180) man[b.dataset.a] -= 360;
        applyPose(); calibOut();
      });
    });
    document.getElementById('cFlip').addEventListener('click', () => { FLIP = FLIP ? 0 : 1; applyPose(); calibOut(); });
    document.getElementById('cReset').addEventListener('click', () => { man.x = 0; man.y = 0; man.z = 0; FLIP = 0; applyPose(); calibOut(); });
    window.addEventListener('keydown', (e) => {
      const s = e.shiftKey ? 45 : 5;
      if (e.key === 'ArrowUp') { man.x -= s; } else if (e.key === 'ArrowDown') { man.x += s; }
      else if (e.key === 'ArrowLeft') { man.y -= s; } else if (e.key === 'ArrowRight') { man.y += s; }
      else if (e.key === 'a' || e.key === 'A') { man.z -= s; } else if (e.key === 'e' || e.key === 'E') { man.z += s; }
      else if (e.key === 'f' || e.key === 'F') { FLIP = FLIP ? 0 : 1; }
      else if (e.key === 'r' || e.key === 'R') { man.x = 0; man.y = 0; man.z = 0; FLIP = 0; }
      else return;
      e.preventDefault(); applyPose(); calibOut();
    });
  }

  /* ==========================================================
     9. Caméra orbitale
     ========================================================== */
  const cam = {
    yaw: 0, elev: ELEV_START, zoom: 1,
    tYaw: 0, tElev: ELEV_START, tZoom: 1, vYaw: 0,
  };
  function place() {
    const d = CAM_DIST * cam.zoom;
    const e = cam.elev * Math.PI / 180, y = cam.yaw * Math.PI / 180;
    camera.setPosition(
      d * Math.cos(e) * Math.sin(y),
      d * Math.sin(e) + LOOK_Y,
      d * Math.cos(e) * Math.cos(y)
    );
    camera.lookAt(0, LOOK_Y, 0);
  }
  place();

  const clampZoom = (z) => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  const pts = new Map();
  let pinch = 0;
  const hint = document.getElementById('hint');

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cam.vYaw = 0;
    hint.classList.add('gone');
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      cam.tYaw += dx * ROT_SPEED;
      cam.vYaw = dx * ROT_SPEED * 0.32;
      cam.tElev = Math.min(ELEV_MAX, Math.max(ELEV_MIN, cam.tElev - dy * ELEV_SPEED));
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch > 0 && d > 0) cam.tZoom = clampZoom(cam.tZoom * (pinch / d));
      pinch = d;
    }
  });
  const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tZoom = clampZoom(cam.tZoom * (1 + Math.sign(e.deltaY) * 0.08));
  }, { passive: false });

  app.on('update', () => {
    cam.tYaw += cam.vYaw;
    cam.vYaw *= FRICTION;
    cam.yaw += (cam.tYaw - cam.yaw) * SMOOTH;
    cam.elev += (cam.tElev - cam.elev) * SMOOTH;
    place();
  });

  app.start();
  setProgress(100);
  setTimeout(() => loader.classList.add('gone'), 250);
  setTimeout(() => hint.classList.add('gone'), 5000);
  dbg('prêt', 'ok');
})();
</script>
</body>
</html>
