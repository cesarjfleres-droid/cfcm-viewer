<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CF&amp;CM · Visualisation 3D</title>
<style>
:root {
  --gold: #d4af37;
  --gold-soft: #e8c870;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  touch-action: none;
  overscroll-behavior: none;
}
#camera-feed {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  object-fit: cover;
  z-index: 1;
  background: #000;
  transition: transform 0.3s ease;
}
#camera-feed.mirrored { transform: scaleX(-1); }
#shadow {
  position: fixed;
  left: 50%; top: 58%;
  transform: translate(-50%, -50%);
  width: 38vw; height: 7vw;
  max-width: 260px; max-height: 46px;
  background: radial-gradient(ellipse,
    rgba(0,0,0,0.50) 0%, rgba(0,0,0,0.25) 35%, rgba(0,0,0,0) 70%);
  filter: blur(10px);
  z-index: 2;
  pointer-events: none;
}
#viewer-3d {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  z-index: 3;
  display: block;
  touch-action: none;
  background: transparent;
}
#back-btn {
  position: fixed;
  top: calc(16px + var(--safe-top));
  left: 16px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(20,20,20,0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 25;
  text-decoration: none;
  transition: transform 0.2s, background 0.2s;
}
#back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.18); }
#back-btn svg { width: 20px; height: 20px; }
#hint {
  position: fixed;
  left: 50%;
  bottom: calc(140px + var(--safe-bottom));
  transform: translateX(-50%);
  font-size: 11px; letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.40);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 10px 18px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.10);
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.6s;
  white-space: nowrap;
}
#hint.faded { opacity: 0; }
#ui-controls {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 16px 28px calc(28px + var(--safe-bottom));
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  background: linear-gradient(to top,
    rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0) 100%);
  pointer-events: none;
}
#ui-controls > * { pointer-events: auto; }
#ui-controls .placeholder { width: 52px; height: 52px; visibility: hidden; }
#flip-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(20,20,20,0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.25s, background 0.2s;
}
#flip-btn svg { width: 22px; height: 22px; }
#flip-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.18); }
#flip-btn.flipping svg { animation: flip-spin 0.5s ease; }
@keyframes flip-spin {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(180deg); }
}
#capture-btn {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: transparent; border: none;
  position: relative;
  cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.capture-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 3px solid #fff;
  transition: transform 0.15s;
}
.capture-dot {
  width: 58px; height: 58px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s, background 0.15s;
}
#capture-btn:active .capture-ring { transform: scale(1.06); }
#capture-btn:active .capture-dot { transform: scale(0.85); background: var(--gold); }
#capture-flash {
  position: fixed; inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: opacity 0.12s;
}
#capture-flash.flash { opacity: 0.85; }
#loader {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, #1a1410 0%, #000 100%);
  z-index: 1000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px;
  transition: opacity 0.7s;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader .logo {
  font-size: 32px; letter-spacing: 6px; font-weight: 200;
  font-family: 'Cormorant Garamond', Georgia, serif;
}
#loader .logo span { color: var(--gold); font-weight: 500; }
.loader-bar {
  width: 220px; height: 2px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px; overflow: hidden;
}
#loader-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-soft));
  transition: width 0.25s;
  box-shadow: 0 0 12px rgba(212,175,55,0.6);
}
#loader-percent {
  font-size: 11px; letter-spacing: 4px;
  color: rgba(255,255,255,0.45); font-weight: 300;
}
.loader-hint {
  font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  margin-top: 4px;
}
#camera-denied {
  position: fixed; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: #000;
  z-index: 999;
  padding: 40px; text-align: center;
}
#camera-denied.visible { display: flex; }
.denied-box h2 {
  font-size: 22px; font-weight: 300; letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 16px;
}
.denied-box p {
  font-size: 14px; line-height: 1.7;
  color: rgba(255,255,255,0.7);
  max-width: 320px;
}
</style>
</head>
<body>
<video id="camera-feed" autoplay muted playsinline webkit-playsinline></video>
<div id="shadow"></div>
<canvas id="viewer-3d"></canvas>

<a id="back-btn" href="index.html" aria-label="Retour à la carte">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/>
    <path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<div id="hint">Glissez pour explorer</div>

<div id="ui-controls">
  <button id="flip-btn" aria-label="Changer de caméra">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"/>
      <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
      <path d="M8 11l-2 2 2 2"/>
      <path d="M16 11l2 2-2 2"/>
      <path d="M6 13h12"/>
    </svg>
  </button>

  <button id="capture-btn" aria-label="Prendre une photo">
    <span class="capture-ring"></span>
    <span class="capture-dot"></span>
  </button>

  <div class="placeholder" aria-hidden="true"></div>
</div>

<div id="capture-flash"></div>

<div id="loader">
  <div class="logo">CF<span>&amp;</span>CM</div>
  <div class="loader-bar"><div id="loader-fill"></div></div>
  <div id="loader-percent">0%</div>
  <div class="loader-hint">Préparation de la 3D</div>
</div>

<div id="camera-denied">
  <div class="denied-box">
    <h2>Caméra requise</h2>
    <p>Autorisez l'accès à la caméra dans les réglages de votre navigateur pour visualiser le plat en réalité augmentée.</p>
  </div>
</div>

<!-- PlayCanvas SDK -->
<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.17.2/build/playcanvas.min.js"
        onerror="document.getElementById('loader-percent').textContent='ERR CDN PlayCanvas'"></script>

<!-- ✅ Logique multi-plats (catalogue dans viewer.js) -->
<script src="viewer.js?v=7"></script>

</body>
</html>
