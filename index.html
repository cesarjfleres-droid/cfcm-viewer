<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="Carte numérique du restaurant — visualisation 3D des plats par CF&CM" />
  <title>La Maison Auberge — Carte numérique CF&CM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ─────────  Header  ───────── -->
  <header class="header" role="banner">
    <div class="brand" aria-label="CF et CM">
      <span class="brand__bracket brand__bracket--tl" aria-hidden="true"></span>
      <span class="brand__bracket brand__bracket--br" aria-hidden="true"></span>
      <span class="brand__text">
        <span class="brand__mono">CF</span>
        <span class="brand__amp">&amp;</span>
        <span class="brand__mono brand__mono--accent">CM</span>
      </span>
    </div>

    <div class="header__divider" aria-hidden="true"></div>

    <h1 class="restaurant">
      <span class="restaurant__eyebrow">Carte du soir</span>
      <span class="restaurant__name">La Maison Auberge</span>
      <span class="restaurant__location">Arles · Provence</span>
    </h1>

    <p class="intro">
      Sélectionnez un plat pour le découvrir en trois dimensions —
      <em>une visualisation fidèle, signée CF&amp;CM.</em>
    </p>
  </header>

  <!-- ─────────  Menu  ───────── -->
  <main class="menu" id="menu" role="main">
    <!-- Sections will be injected by script.js -->
  </main>

  <!-- ─────────  Footer  ───────── -->
  <footer class="footer" role="contentinfo">
    <div class="footer__mark">
      <span class="brand__mono">CF</span><span class="brand__amp">&amp;</span><span class="brand__mono brand__mono--accent">CM</span>
    </div>
    <p class="footer__line">Visualisation 3D pour la restauration</p>
    <p class="footer__line footer__line--muted">
      <a href="https://cf-cm.com" class="footer__link">cf-cm.com</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
