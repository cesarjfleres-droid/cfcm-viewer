<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Food3D · Tarte aux Fraises</title>
<style>
:root {
  --gold: #d4af37;
  --gold-soft: #e8c870;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  touch-action: none;
  overscroll-behavior: none;
}

#camera-feed {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  object-fit: cover;
  z-index: 1;
  background: #000;
}
#camera-feed.mirrored { transform: scaleX(-1); }

#shadow {
  position: fixed;
  left: 50%; top: 62%;
  transform: translate(-50%, -50%);
  width: 42vw; height: 8vw;
  max-width: 280px; max-height: 50px;
  background: radial-gradient(ellipse,
    rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.30) 35%, rgba(0,0,0,0) 70%);
  filter: blur(8px);
  z-index: 2;
  pointer-events: none;
}

#viewer-3d {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  z-index: 3;
  display: block;
  touch-action: none;
  background: transparent;
}

#hint {
  position: fixed;
  left: 50%;
  bottom: calc(140px + var(--safe-bottom));
  transform: translateX(-50%);
  font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.40);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 10px 18px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.10);
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.6s;
  white-space: nowrap;
}
#hint.faded { opacity: 0; }

#ui-controls {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 16px 28px calc(28px + var(--safe-bottom));
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  background: linear-gradient(to top,
    rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0) 100%);
  pointer-events: none;
}
#ui-controls > * { pointer-events: auto; }
#ui-controls .placeholder { width: 52px; height: 52px; visibility: hidden; }

#flip-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(20,20,20,0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.25s, background 0.2s;
}
#flip-btn svg { width: 24px; height: 24px; }
#flip-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.18); }
#flip-btn.flipping svg { animation: flip-spin 0.5s ease; }
@keyframes flip-spin {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(180deg); }
}

#capture-btn {
  width: 76px; height: 76px;
  border-radius: 50%;
  background: transparent; border: none;
  position: relative;
  cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.capture-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 3px solid #fff;
  transition: transform 0.15s;
}
.capture-dot {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s, background 0.15s;
}
#capture-btn:active .capture-ring { transform: scale(1.06); }
#capture-btn:active .capture-dot  { transform: scale(0.85); background: var(--gold); }

#capture-flash {
  position: fixed; inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: opacity 0.12s;
}
#capture-flash.flash { opacity: 0.85; }

#loader {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, #1a1410 0%, #000 100%);
  z-index: 1000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px;
  transition: opacity 0.7s;
}
#loader.hidden { opacity: 0; pointer-events: none; }
#loader .logo {
  font-size: 38px; letter-spacing: 7px; font-weight: 200;
}
#loader .logo span { color: var(--gold); font-weight: 600; }
.loader-bar {
  width: 220px; height: 2px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px; overflow: hidden;
}
#loader-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-soft));
  transition: width 0.25s;
  box-shadow: 0 0 12px rgba(212,175,55,0.6);
}
#loader-percent {
  font-size: 11px; letter-spacing: 4px;
  color: rgba(255,255,255,0.45); font-weight: 300;
}
.loader-hint {
  font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  margin-top: 4px;
}

#camera-denied {
  position: fixed; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: #000;
  z-index: 999;
  padding: 40px; text-align: center;
}
#camera-denied.visible { display: flex; }
.denied-box h2 {
  font-size: 22px; font-weight: 300; letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 16px;
}
.denied-box p {
  font-size: 14px; line-height: 1.7;
  color: rgba(255,255,255,0.7);
  max-width: 320px;
}
</style>
</head>
<body>

<video id="camera-feed" autoplay muted playsinline webkit-playsinline></video>
<div id="shadow"></div>
<canvas id="viewer-3d"></canvas>

<div id="hint">Glissez pour explorer</div>

<div id="ui-controls">
  <button id="flip-btn" aria-label="Changer de caméra">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"/>
      <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
      <path d="M8 11l-2 2 2 2"/>
      <path d="M16 11l2 2-2 2"/>
      <path d="M6 13h12"/>
    </svg>
  </button>
  <button id="capture-btn" aria-label="Prendre une photo">
    <span class="capture-ring"></span>
    <span class="capture-dot"></span>
  </button>
  <div class="placeholder" aria-hidden="true"></div>
</div>

<div id="capture-flash"></div>

<div id="loader">
  <div class="logo">FOOD<span>3D</span></div>
  <div class="loader-bar"><div id="loader-fill"></div></div>
  <div id="loader-percent">0%</div>
  <div class="loader-hint">Chargement du modèle 3D</div>
</div>

<div id="camera-denied">
  <div class="denied-box">
    <h2>Caméra requise</h2>
    <p>Autorisez l'accès à la caméra dans les réglages de votre navigateur pour visualiser le plat en réalité augmentée.</p>
  </div>
</div>

<!-- PlayCanvas 2.17.2 — UMD build, expose global `pc` -->
<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.17.2/build/playcanvas.min.js"
        onerror="document.getElementById('loader-percent').textContent='ERR CDN PlayCanvas'"></script>
<script>
(async function main() {
  const $ = (id) => document.getElementById(id);
  const loader        = $('loader');
  const loaderFill    = $('loader-fill');
  const loaderPercent = $('loader-percent');
  const video         = $('camera-feed');
  const canvas        = $('viewer-3d');
  const shadowEl      = $('shadow');
  const hint          = $('hint');
  const flash         = $('capture-flash');
  const captureBtn    = $('capture-btn');
  const flipBtn       = $('flip-btn');

  const setProgress = (p) => {
    loaderFill.style.width = p + '%';
    loaderPercent.textContent = Math.round(p) + '%';
  };

  let stream = null;
  let currentFacingMode = 'environment';

  async function startCamera(facingMode) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    currentFacingMode = facingMode;
    video.classList.toggle('mirrored', facingMode === 'user');
  }

  try {
    await startCamera('environment');
    setProgress(15);
  } catch (err) {
    console.error('[Food3D] Camera denied:', err);
    $('camera-denied').classList.add('visible');
    loader.style.display = 'none';
    return;
  }

  if (typeof pc === 'undefined') {
    console.error('[Food3D] PlayCanvas not loaded');
    return;
  }

  const app = new pc.AppBase(canvas);
  const gfxDevice = await pc.createGraphicsDevice(canvas, {
    deviceTypes: ['webgl2', 'webgl1'],
    antialias: true, alpha: true,
    preserveDrawingBuffer: true,
    powerPreference: 'high-performance'
  });

  const createOptions = new pc.AppOptions();
  createOptions.graphicsDevice = gfxDevice;
  createOptions.mouse = new pc.Mouse(canvas);
  createOptions.touch = new pc.TouchDevice(canvas);
  createOptions.componentSystems = [
    pc.RenderComponentSystem,
    pc.CameraComponentSystem,
    pc.ScriptComponentSystem,
    pc.GSplatComponentSystem
  ];
  createOptions.resourceHandlers = [
    pc.TextureHandler,
    pc.ContainerHandler,
    pc.ScriptHandler,
    pc.GSplatHandler
  ];

  app.init(createOptions);
  app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
  app.setCanvasResolution(pc.RESOLUTION_AUTO);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  gfxDevice.maxPixelRatio = dpr;
  app.scene.skyboxIntensity = 0;
  setProgress(28);

  // Composition hardcodée
  const SPLAT_POS_X = 0, SPLAT_POS_Y = 0, SPLAT_POS_Z = 0;
  const CAM_POS_X   = 0, CAM_POS_Y   = 0, CAM_POS_Z   = 5800;
  const SPLAT_SCALE = 3000;
  const SPLAT_EULER_X = -90, SPLAT_EULER_Y = 0, SPLAT_EULER_Z = 180;
  const SPLAT_TRIM_X  = 12,  SPLAT_TRIM_Y  = 0, SPLAT_TRIM_Z  = 0;
  const SPLAT_LIFT_Y  = 2500;
  const FOV_Y         = 50;

  const cameraEntity = new pc.Entity('camera');
  cameraEntity.addComponent('camera', {
    clearColor: new pc.Color(0, 0, 0, 0),
    clearColorBuffer: true,
    clearDepthBuffer: true,
    fov: FOV_Y, nearClip: 0.01, farClip: 1e7
  });
  cameraEntity.setPosition(CAM_POS_X, CAM_POS_Y, CAM_POS_Z);
  cameraEntity.lookAt(SPLAT_POS_X, SPLAT_POS_Y, SPLAT_POS_Z);
  app.root.addChild(cameraEntity);
  setProgress(40);

  const splatAsset = new pc.Asset('fraise', 'gsplat', { url: 'fraise.ply' });
  app.assets.add(splatAsset);
  splatAsset.on('progress', (received, total) => {
    if (total > 0) setProgress(40 + (received / total) * 50);
  });

  try {
    await new Promise((resolve, reject) => {
      splatAsset.once('load', resolve);
      splatAsset.once('error', reject);
      app.assets.load(splatAsset);
    });
  } catch (err) {
    console.error('[Food3D] Splat load failed:', err);
    loader.style.display = 'none';
    return;
  }
  setProgress(92);

  const pivot = new pc.Entity('pivot');
  app.root.addChild(pivot);
  pivot.setPosition(SPLAT_POS_X, SPLAT_POS_Y, SPLAT_POS_Z);

  const splatEntity = new pc.Entity('splat');
  splatEntity.addComponent('gsplat', { asset: splatAsset });
  pivot.addChild(splatEntity);
  splatEntity.setLocalScale(SPLAT_SCALE, SPLAT_SCALE, SPLAT_SCALE);
  splatEntity.setLocalEulerAngles(
    SPLAT_EULER_X + SPLAT_TRIM_X,
    SPLAT_EULER_Y + SPLAT_TRIM_Y,
    SPLAT_EULER_Z + SPLAT_TRIM_Z
  );

  const TART_LOCAL_CENTRE = new pc.Vec3(0.165, 0.623, -1.573);
  const _scaled = new pc.Vec3(
    TART_LOCAL_CENTRE.x * SPLAT_SCALE,
    TART_LOCAL_CENTRE.y * SPLAT_SCALE,
    TART_LOCAL_CENTRE.z * SPLAT_SCALE
  );
  const _rot = new pc.Quat();
  _rot.setFromEulerAngles(
    SPLAT_EULER_X + SPLAT_TRIM_X,
    SPLAT_EULER_Y + SPLAT_TRIM_Y,
    SPLAT_EULER_Z + SPLAT_TRIM_Z
  );
  const _rotated = new pc.Vec3();
  _rot.transformVector(_scaled, _rotated);
  splatEntity.setLocalPosition(-_rotated.x, -_rotated.y + SPLAT_LIFT_Y, -_rotated.z);

  app.start();
  await new Promise((r) => requestAnimationFrame(r));
  await new Promise((r) => requestAnimationFrame(r));
  setProgress(98);

  // Interaction
  let isDragging = false;
  let activePointerId = null;
  let lastX = 0, lastY = 0;
  let velY = 0, velX = 0;
  let targetRotY = 0, targetRotX = 0;
  let rotY = 0, rotX = 0;
  let userInteracted = false;
  const ROT_SPEED = 0.6, SMOOTH = 0.25, FRICTION = 0.94, MAX_TILT = 40;

  function onDown(e) {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    isDragging = true; userInteracted = true;
    hint.classList.add('faded');
    velX = velY = 0;
    lastX = e.clientX; lastY = e.clientY;
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    if (!isDragging || e.pointerId !== activePointerId) return;
    if (e.cancelable) e.preventDefault();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    velY = dx * ROT_SPEED; velX = dy * ROT_SPEED;
    targetRotY += velY;
    targetRotX = Math.max(-MAX_TILT, Math.min(MAX_TILT, targetRotX + velX));
  }
  function onUp(e) {
    if (e.pointerId !== activePointerId) return;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    activePointerId = null; isDragging = false;
  }
  canvas.addEventListener('pointerdown',   onDown, { passive: false });
  canvas.addEventListener('pointermove',   onMove, { passive: false });
  canvas.addEventListener('pointerup',     onUp);
  canvas.addEventListener('pointercancel', onUp);

  let t0 = performance.now();
  app.on('update', (dt) => {
    const t = (performance.now() - t0) / 1000;
    if (userInteracted && !isDragging) {
      targetRotY += velY;
      targetRotX = Math.max(-MAX_TILT, Math.min(MAX_TILT, targetRotX + velX));
      velY *= FRICTION; velX *= FRICTION;
      if (Math.abs(velY) < 0.01) velY = 0;
      if (Math.abs(velX) < 0.01) velX = 0;
    }
    rotY += (targetRotY - rotY) * SMOOTH;
    rotX += (targetRotX - rotX) * SMOOTH;
    pivot.setLocalEulerAngles(rotX, 0, rotY);
    const s = 1 + Math.sin(t * 1.2) * 0.04;
    const o = 0.85 + Math.sin(t * 1.2) * 0.08;
    shadowEl.style.transform = `translate(-50%, -50%) scale(${s})`;
    shadowEl.style.opacity = o.toFixed(2);
  });

  setProgress(100);
  setTimeout(() => hint.classList.add('faded'), 4000);

  window.addEventListener('resize', () => app.resizeCanvas());
  window.addEventListener('orientationchange', () => setTimeout(() => app.resizeCanvas(), 200));

  // Flip camera
  let flipLock = false;
  flipBtn.addEventListener('click', async () => {
    if (flipLock) return;
    flipLock = true;
    flipBtn.classList.add('flipping');
    const next = currentFacingMode === 'environment' ? 'user' : 'environment';
    try { await startCamera(next); }
    catch (err) {
      console.error('[Food3D] Flip failed:', err);
      try { await startCamera(currentFacingMode); } catch (_) {}
    } finally {
      setTimeout(() => {
        flipBtn.classList.remove('flipping');
        flipLock = false;
      }, 500);
    }
  });

  // Capture
  captureBtn.addEventListener('click', () => {
    flash.classList.add('flash');
    setTimeout(() => flash.classList.remove('flash'), 120);
    app.render();

    const W = window.innerWidth  * dpr;
    const H = window.innerHeight * dpr;
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const ctx = out.getContext('2d');

    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      const screenAR = W / H, videoAR = vw / vh;
      let sx, sy, sw, sh;
      if (videoAR > screenAR) {
        sh = vh; sw = vh * screenAR;
        sx = (vw - sw) / 2; sy = 0;
      } else {
        sw = vw; sh = vw / screenAR;
        sx = 0; sy = (vh - sh) / 2;
      }
      if (currentFacingMode === 'user') {
        ctx.save();
        ctx.translate(W, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
        ctx.restore();
      } else {
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
      }
    } else {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
    }

    const cx = W / 2, cy = H * 0.62;
    const rx = W * 0.21, ry = H * 0.035;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0,    'rgba(0,0,0,0.55)');
    grad.addColorStop(0.35, 'rgba(0,0,0,0.30)');
    grad.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.drawImage(canvas, 0, 0, W, H);

    out.toBlob((blob) => {
      if (!blob) return;
      const filename = `food3d-${Date.now()}.jpg`;
      const file = new File([blob], filename, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Food3D' }).catch(() => downloadBlob(blob, filename));
      } else {
        downloadBlob(blob, filename);
      }
    }, 'image/jpeg', 0.92);
  });

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  window.addEventListener('pagehide', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try { app.destroy(); } catch (e) {}
  });

  setTimeout(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.style.display = 'none', 700);
  }, 200);

})().catch(err => {
  console.error('[Food3D] FATAL', err);
});
</script>
</body>
</html>
