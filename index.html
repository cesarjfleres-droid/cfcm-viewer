<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>Food3D</title>
<link rel="preload" href="fraise.ply" as="fetch" crossorigin="anonymous" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<video id="camera-feed" autoplay playsinline muted webkit-playsinline></video>

<div id="shadow"></div>

<canvas id="viewer-3d"></canvas>

<div id="capture-flash"></div>

<div id="ui">
  <div id="hint">Glissez pour tourner le plat</div>
  <button id="capture-btn" aria-label="Capturer">
    <span class="ring"></span>
    <span class="dot"></span>
  </button>
</div>

<div id="loader">
  <div class="loader-title">FOOD3D</div>
  <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
  <div class="loader-percent" id="loader-percent">0%</div>
</div>

<div id="camera-denied">
  <h2>Caméra requise</h2>
  <p>Pour visualiser le plat dans votre environnement, autorisez l'accès à la caméra dans les réglages de votre navigateur.</p>
  <button onclick="location.reload()">Réessayer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.10.0/build/playcanvas.min.js"></script>
<script src="viewer.js"></script>

</body>
</html>
