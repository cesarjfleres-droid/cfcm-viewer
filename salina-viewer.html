<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a2940" />
<title>Salina · Dégustation 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="salina-viewer.css?v=1010" />
</head>
<body class="mode-studio">

<!-- Fond studio (mode 3D classique, par défaut) -->
<div id="studio-bg"></div>

<!-- Flux caméra (mode immersif, opt-in) -->
<video id="camera-feed" autoplay playsinline muted webkit-playsinline></video>

<!-- Ombre de contact -->
<div id="shadow"></div>

<!-- Canvas splat transparent -->
<canvas id="viewer-3d"></canvas>

<!-- Flash de capture -->
<div id="capture-flash"></div>

<!-- Interface -->
<div id="ui">

  <!-- Barre haute : retour + plat -->
  <header id="topbar">
    <a id="back-btn" href="salina-menu.html" aria-label="Retour à la carte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>La carte</span>
    </a>
    <div id="dish-label">
      <span id="dish-name">—</span>
      <span id="dish-price"></span>
    </div>
  </header>

  <div id="hint">Glissez pour tourner · pincez pour zoomer</div>

  <!-- Barre basse : réinitialiser · capture · mode immersif -->
  <div id="controls">
    <button type="button" id="reset-btn" class="ghost-btn" aria-label="Réinitialiser la vue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
      </svg>
    </button>

    <button type="button" id="capture-btn" aria-label="Capturer une photo">
      <span class="ring"></span>
      <span class="dot"></span>
    </button>

    <button type="button" id="ar-btn" class="ghost-btn" aria-label="Voir autour de vous (caméra)" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
        <circle cx="12" cy="13" r="3"></circle>
      </svg>
    </button>

    <button type="button" id="flip-btn" class="ghost-btn" aria-label="Retourner la caméra (selfie)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 1l4 4-4 4"></path>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <path d="M7 23l-4-4 4-4"></path>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>
  </div>
</div>

<!-- Loader -->
<div id="loader">
  <div class="loader-mark">Salina</div>
  <div class="loader-sub" id="loader-dish">Dégustation 3D</div>
  <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
  <div class="loader-percent" id="loader-percent">0%</div>
</div>

<!-- Toast (erreurs, refus caméra — non bloquant) -->
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.10.0/build/playcanvas.min.js"></script>
<script src="salina-viewer.js?v=1010"></script>

</body>
</html>
